name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.20"
      - run: go test ./...
      - run: go vet ./...
      - run: go test ./internal/api -run '^$' -bench BenchmarkListProducts -benchtime=2s
